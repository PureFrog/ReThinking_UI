<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>분산 바구니</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<!--
  분산 바구니 (피드백 2026-11-26 "점검 중인 오락실 기계에 진짜 사람들이 환호할 도파민 터지는 미니게임, 세계관에 맞는 보상"):
  fruit falls from the orchard's trees; drag (or ←/→) the basket to catch it.
    · a different fruit from the last two grows the 골고루 보너스 (×1 → ×5); the same fruit three times running (쏠림) sends it back to ×1
    · 🐛 a bug (손실 신호) costs a heart; three hearts
    · ⭐ starts 황금 열매 타임: six seconds of golden fruit, everything ×2, music up
  피드백 2026-11-26 "튜토리얼 만들어주고 분산피버, 분산콤보 말 이상해": plain words (골고루 보너스, 쏠림, 황금 열매 타임) and a
  step-by-step how-to before the first game (again from 방법 보기), ending on what this has to do with 분산 투자.
    · it gets faster every 15 seconds
  At the end the score goes to the arcade (postMessage rt-arcade-score); the arcade pays coins for it (a fixed rate,
  a daily cap) and answers rt-arcade-paid, shown on the result card. No buying, no chance of winning coins: skill only.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1c1530;overflow:hidden;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:min(100vw,480px);height:100dvh;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-family:'Jua',sans-serif}
.score{font-size:30px;color:#fff;text-shadow:0 3px 0 #0006}
.best{font-size:12px;color:#ffe9a8}
.hearts{font-size:22px;letter-spacing:2px}
.combo{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);font-family:'Jua',sans-serif;color:#ffd447;font-size:22px;text-shadow:0 3px 0 #7a3b00;pointer-events:none;transition:transform .12s}
.combo.pop{transform:translateX(-50%) scale(1.35)}
.card{position:absolute;inset:0;display:grid;place-items:center;background:#120c22cc;z-index:5}
.box{width:min(88%,380px);background:#fff8ea;border:4px solid #c9a77a;border-radius:24px;padding:20px 18px;text-align:center;box-shadow:0 6px 0 #8a6440;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.box h1{font-family:'Jua',sans-serif;font-size:30px;color:#c4432f;margin-bottom:4px}
.box h2{font-family:'Jua',sans-serif;font-size:20px;color:#4a3420;margin:6px 0}
.box p{font-size:14px;color:#5b4630;line-height:1.55;margin:6px 0}
.rules{display:grid;gap:8px;margin:12px 0;text-align:left}
.rules div{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;border:1px solid #ecdcbc;font-size:13.5px;color:#4a3420}
.rules b{font-size:24px;width:34px;text-align:center}
button{font-family:'Jua',sans-serif;font-size:19px;border:0;border-radius:16px;padding:12px 26px;background:#ffd447;color:#4a3420;box-shadow:0 5px 0 #c99a1a;cursor:pointer;margin-top:6px}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a1a}
.sm{font-size:14px;padding:8px 14px;background:#eee3cc;box-shadow:0 3px 0 #b9a885}
.big{font-family:'Jua',sans-serif;font-size:52px;color:#c4432f;line-height:1.1}
.paid{font-family:'Jua',sans-serif;font-size:20px;color:#2b7a44;margin-top:4px;min-height:26px}
.newbest{display:inline-block;background:#c4432f;color:#fff;border-radius:10px;padding:2px 10px;font-family:'Jua',sans-serif;font-size:14px;animation:wob .6s infinite alternate}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg) scale(1.08)}}
.mute{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;background:#fff8eacc;border-radius:12px;font-size:16px;padding:6px 10px;box-shadow:none;margin:0}
.fever{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:'Jua',sans-serif;font-size:44px;color:#ffd447;text-shadow:0 0 18px #ff7a00,0 4px 0 #7a3b00;pointer-events:none;opacity:0;transform:scale(.6)}
.fever.on{animation:fv 1.2s ease-out}
.tut-pic{font-size:46px;line-height:1.2;margin:8px 0 4px;letter-spacing:4px}
.tut-step{font-size:12px;color:#a08560;font-family:'Jua',sans-serif}
.tut-dots{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}.tut-dots i{width:7px;height:7px;border-radius:50%;background:#e3d3b2}.tut-dots i.on{background:#c4432f}
.tut-acts{display:flex;gap:8px;justify-content:center;align-items:center}
.box p.tut-text{font-size:15px;min-height:72px}
.tut-text b{color:#c4432f}
@keyframes fv{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="hud"><div><div class="score" id="score">0</div><div class="best" id="best"></div></div><div class="hearts" id="hearts">❤️❤️❤️</div></div>
  <div class="combo" id="combo"></div>
  <div class="fever" id="fever">황금 열매 타임!</div>
  <button class="mute" id="mute" type="button" aria-label="소리">🔊</button>
  <div class="card" id="start"><div class="box">
    <h1>분산 바구니</h1>
    <p>과수원 나무에서 열매가 떨어져요. 바구니를 끌어서 받아요.</p>
    <div class="rules">
      <div><b>🍎🍊🍇</b><span>여러 열매를 <b style="font-size:13px;width:auto;color:#c4432f">골고루</b> 받으면 보너스가 올라요 (최대 ×5)</span></div>
      <div><b>🍎🍎🍎</b><span>한 가지만 세 번 연달아 받으면 보너스가 처음으로 돌아가요</span></div>
      <div><b>🐛</b><span>벌레(손실 신호)는 피해요. 하트는 3개</span></div>
      <div><b>⭐</b><span>별을 받으면 6초 동안 <b style="font-size:13px;width:auto;color:#c4432f">황금 열매</b>, 점수 ×2</span></div>
    </div>
    <button id="go" type="button">시작!</button> <button class="sm" id="how" type="button">방법 보기</button>
    <p style="font-size:12px">점수만큼 코인을 받아요 (하루 최대 정해져 있어요)</p>
  </div></div>
  <div class="card" id="tut" style="display:none"><div class="box">
    <div class="tut-step" id="tutStep"></div>
    <h2 id="tutTitle"></h2>
    <div class="tut-pic" id="tutPic"></div>
    <p class="tut-text" id="tutText"></p>
    <div class="tut-dots" id="tutDots"></div>
    <div class="tut-acts"><button class="sm" id="tutPrev" type="button">이전</button><button id="tutNext" type="button">다음</button></div>
    <p><button class="sm" id="tutSkip" type="button" style="background:none;box-shadow:none;font-size:13px;color:#a08560;text-decoration:underline">건너뛰기</button></p>
  </div></div>
  <div class="card" id="end" style="display:none"><div class="box">
    <h2>게임 끝!</h2>
    <div class="big" id="final">0</div>
    <div id="nb"></div>
    <p id="stat"></p>
    <div class="paid" id="paid"></div>
    <button id="again" type="button">한 판 더</button>
  </div></div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),app=document.getElementById('app');
let W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,devicePixelRatio||1);W=app.clientWidth;H=app.clientHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
const FRUIT=[{e:'🍎',c:'#e0493d'},{e:'🍊',c:'#f29a2e'},{e:'🍇',c:'#8a4fc4'},{e:'🍐',c:'#9cc44a'},{e:'🍑',c:'#f2a0a8'}];
const BEST_KEY='rethink-basket-best';
let best=+(localStorage.getItem(BEST_KEY)||0);$('best').textContent=best?`최고 ${best}`:'';

// ---------- sound: little synth blips and a loop (WebAudio) ----------
let ac=null,muted=localStorage.getItem('rethink-basket-mute')==='1',music=null;$('mute').textContent=muted?'🔇':'🔊';
const A=()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac};
function tone(f,d=.09,type='square',v=.06,slide=0,when=0){const a=A();if(!a||muted)return;const t=a.currentTime+when,o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={catch:(k)=>{tone(440*Math.pow(1.1225,Math.min(k,12)),.08,'square',.05);tone(880*Math.pow(1.1225,Math.min(k,12)),.06,'triangle',.03,0,.04)},
  combo:()=>[0,4,7,12].forEach((s,i)=>tone(523*Math.pow(2,s/12),.1,'square',.05,0,i*.05)),
  bad:()=>{tone(180,.25,'sawtooth',.08,.5)},break:()=>tone(330,.18,'triangle',.06,.6),
  star:()=>[0,4,7,12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),.12,'square',.05,0,i*.045)),
  over:()=>[12,7,4,0].forEach((s,i)=>tone(392*Math.pow(2,s/12),.22,'triangle',.07,0,i*.16)),miss:()=>tone(240,.08,'sine',.04,.8)};
function startMusic(){stopMusic();const a=A();if(!a)return;let step=0;const bass=[0,0,7,7,5,5,3,3],mel=[12,15,19,15,17,15,12,10];
  music=setInterval(()=>{if(muted||state!=='play')return;const fast=fever>0;const b=bass[step%8],m=mel[(step*3)%8];tone(110*Math.pow(2,b/12),.18,'triangle',.05);
    if(step%2===0||fast)tone(440*Math.pow(2,m/12)*(fast?2:1),.1,'square',fast?.035:.022);if(fast)tone(880,.03,'square',.015,0,.06);step++},fever>0?110:150)}
function stopMusic(){if(music){clearInterval(music);music=null}}
$('mute').onclick=()=>{muted=!muted;localStorage.setItem('rethink-basket-mute',muted?'1':'0');$('mute').textContent=muted?'🔇':'🔊'};

// ---------- game ----------
let state='start',score=0,hearts=3,combo=1,streak=0,lastTwo=[],sameRun=0,items=[],parts=[],texts=[],t0=0,lastT=0,spawnT=0,fever=0,shake=0,caught=0,maxCombo=1,kinds=new Set(),feverMusic=false;
const basket={x:0,w:96,h:46,tx:0,squash:0};
function reset(){score=0;hearts=3;combo=1;streak=0;lastTwo=[];sameRun=0;items=[];parts=[];texts=[];fever=0;shake=0;caught=0;maxCombo=1;kinds=new Set();basket.x=basket.tx=W/2;spawnT=0;hud()}
function hud(){$('score').textContent=score.toLocaleString();$('hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(3-hearts);
  const c=$('combo');c.textContent=combo>1?`골고루 보너스 ×${combo}`:'';c.classList.remove('pop');void c.offsetWidth;if(combo>1)c.classList.add('pop')}
function speed(el){return 1+Math.min(1.6,el/15000*0.35)}
function spawn(el){const r=Math.random(),sp=speed(el);
  let k;if(r<.07&&fever<=0)k='star';else if(r<.07+Math.min(.22,.1+el/120000))k='bug';else k=Math.floor(Math.random()*FRUIT.length);
  items.push({k,x:30+Math.random()*(W-60),y:-30,vy:(150+Math.random()*90)*sp,rot:Math.random()*6,vr:(Math.random()-.5)*4,gold:fever>0&&typeof k==='number'})}
function burst(x,y,col,n=14,pow=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(80+Math.random()*220)*pow;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,life:1,c:col,r:2+Math.random()*4})}}
function float(x,y,txt,col='#fff',size=22){texts.push({x,y,txt,col,size,life:1})}
function catchIt(it){const bx=basket.x,by=H-70;
  if(it.k==='bug'){hearts--;shake=14;sfx.bad();burst(it.x,it.y,'#5a3d2b',18);float(it.x,it.y-20,'손실 신호!','#ff8a8a',24);combo=1;lastTwo=[];sameRun=0;hud();if(navigator.vibrate)navigator.vibrate(80);if(hearts<=0)over();return}
  if(it.k==='star'){fever=6000;sfx.star();burst(it.x,it.y,'#ffd447',40,1.4);shake=8;const f=$('fever');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');startMusic();score+=50;hud();return}
  const k=it.k;caught++;kinds.add(k);
  if(lastTwo.length&&lastTwo[lastTwo.length-1]===k){sameRun++}else sameRun=1;
  let broke=false;
  if(sameRun>=3){if(combo>1){broke=true;sfx.break();float(bx,by-60,'한 가지만 받았어요! 보너스 ×1','#9ad0ff',18)}combo=1;sameRun=1}
  else if(!lastTwo.includes(k)){const before=combo;combo=Math.min(5,combo+1);if(combo>before&&combo===5)sfx.combo();maxCombo=Math.max(maxCombo,combo)}
  lastTwo=[...lastTwo,k].slice(-2);
  const pts=10*combo*(fever>0?2:1);score+=pts;basket.squash=1;
  if(!broke)sfx.catch(combo*2+(fever>0?3:0));
  burst(it.x,by-10,FRUIT[k].c,fever>0?20:10);float(it.x,by-34,`+${pts}`,fever>0?'#ffd447':'#fff',fever>0?28:22);hud()}
function over(){state='end';stopMusic();sfx.over();const nb=score>best;if(nb){best=score;localStorage.setItem(BEST_KEY,String(best))}
  $('final').textContent=score.toLocaleString();$('nb').innerHTML=nb?'<span class="newbest">최고 기록!</span>':'';
  $('stat').textContent=`받은 열매 ${caught}개 · 종류 ${kinds.size}/5 · 골고루 보너스 최고 ×${maxCombo}`;$('paid').textContent='';
  $('best').textContent=`최고 ${best}`;$('end').style.display='grid';
  try{parent.postMessage({type:'rt-arcade-score',game:'basket',score,best:nb},location.origin)}catch(e){}}
addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='rt-arcade-paid'&&d.game==='basket')$('paid').textContent=d.coins>0?`코인 +${d.coins.toLocaleString()}`:(d.note||'')});
function start(){A();reset();state='play';t0=lastT=performance.now();$('start').style.display='none';$('end').style.display='none';startMusic()}
$('go').onclick=start;$('again').onclick=start;

// ---------- how to play: step cards before the first game (and from 방법 보기) ----------
const TUT_KEY='rethink-basket-tut';
const TUT=[
  {t:'바구니 옮기기',p:'👆🧺',x:'화면을 누른 채 <b>왼쪽·오른쪽으로 끌면</b> 바구니가 따라와요. 키보드는 ← → 키로 움직여요.'},
  {t:'골고루 받기',p:'🍎🍊🍇',x:'바로 전에 받은 두 개와 <b>다른 열매</b>를 받으면 <b>골고루 보너스</b>가 한 칸 올라요(최대 ×5). 점수도 그만큼 커져요. 열매를 놓치면 한 칸 내려가요.'},
  {t:'한 가지만 받으면',p:'🍎🍎🍎',x:'<b>같은 열매를 세 번 연달아</b> 받으면 보너스가 ×1로 돌아가요. 한 가지에만 쏠리면 손해예요.'},
  {t:'벌레는 피하기',p:'🐛',x:'벌레는 <b>손실 신호</b>예요. 받으면 하트가 하나 줄고 보너스도 처음으로 돌아가요. 하트 3개가 다 없어지면 끝나요.'},
  {t:'별은 꼭 받기',p:'⭐',x:'별을 받으면 <b>6초 동안 황금 열매</b>가 떨어지고 점수가 두 배예요.'},
  {t:'이게 분산 투자예요',p:'🧺💡',x:'투자도 같아요. 한 종목에만 넣으면 그 회사 소식 하나에 계좌 전체가 흔들려요. <b>여러 종목에 나눠 담으면</b> 덜 흔들려요.'}];
let tutAt=0,tutThen=null;
function tutShow(){const s=TUT[tutAt];$('tutStep').textContent=`${tutAt+1} / ${TUT.length}`;$('tutTitle').textContent=s.t;$('tutPic').textContent=s.p;$('tutText').innerHTML=s.x;
  $('tutDots').innerHTML=TUT.map((_,i)=>`<i class="${i===tutAt?'on':''}"></i>`).join('');$('tutPrev').style.visibility=tutAt?'visible':'hidden';
  $('tutNext').textContent=tutAt===TUT.length-1?'시작!':'다음'}
function tutOpen(){tutAt=0;tutShow();$('start').style.display='none';$('tut').style.display='grid'}
function tutDone(play){try{localStorage.setItem(TUT_KEY,'1')}catch(e){}$('tut').style.display='none';if(play)start();else $('start').style.display='grid'}
$('tutPrev').onclick=()=>{if(tutAt>0){tutAt--;tutShow()}};
$('tutNext').onclick=()=>{if(tutAt<TUT.length-1){tutAt++;tutShow()}else tutDone(true)};
$('tutSkip').onclick=()=>tutDone(false);
$('how').onclick=tutOpen;
$('go').onclick=()=>{let seen=false;try{seen=localStorage.getItem(TUT_KEY)==='1'}catch(e){}if(seen)start();else tutOpen()};

// input: drag anywhere, or the arrow keys
let drag=false;
const px=e=>(e.touches?e.touches[0].clientX:e.clientX)-app.getBoundingClientRect().left;
app.addEventListener('pointerdown',e=>{if(state!=='play')return;drag=true;basket.tx=px(e)});
addEventListener('pointermove',e=>{if(drag&&state==='play')basket.tx=px(e)});
addEventListener('pointerup',()=>drag=false);
const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if((e.key===' '||e.key==='Enter')&&state!=='play'&&$('tut').style.display==='none')$('go').click()});addEventListener('keyup',e=>keys[e.key]=false);

// ---------- draw ----------
function sky(el){const gr=g.createLinearGradient(0,0,0,H);if(fever>0){const k=(Math.sin(el/120)+1)/2;gr.addColorStop(0,`hsl(${280+k*40},70%,30%)`);gr.addColorStop(1,`hsl(${30+k*20},90%,55%)`)}
  else{gr.addColorStop(0,'#7fc4ea');gr.addColorStop(.65,'#cfeaf6');gr.addColorStop(1,'#bfe0a8')}g.fillStyle=gr;g.fillRect(0,0,W,H);
  // the orchard's canopy up top, swaying
  for(let i=0;i<7;i++){const x=(i+.5)*W/6.5,y=18+Math.sin(el/900+i)*4;g.fillStyle=i%2?'#4f9a45':'#6db24f';g.beginPath();g.arc(x,y,W/7.5,0,7);g.fill()}
  g.fillStyle='#7ab35a';g.fillRect(0,H-26,W,26);g.fillStyle='#5f9a45';for(let x=0;x<W;x+=14)g.fillRect(x,H-26,6,4)}
function drawBasket(){const x=basket.x,y=H-58,w=basket.w,h=basket.h,sq=basket.squash;g.save();g.translate(x,y);g.scale(1+sq*.18,1-sq*.18);
  g.fillStyle='#00000022';g.beginPath();g.ellipse(0,h/2+20,w/2,8,0,0,7);g.fill();
  g.fillStyle='#b9824a';g.beginPath();g.moveTo(-w/2,-h/2);g.lineTo(w/2,-h/2);g.lineTo(w/2-12,h/2);g.lineTo(-w/2+12,h/2);g.closePath();g.fill();
  g.strokeStyle='#8a5a2e';g.lineWidth=3;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*w/6,-h/2);g.lineTo(i*w/7,h/2);g.stroke()}
  for(let j=0;j<3;j++){g.beginPath();g.moveTo(-w/2+j*4,-h/2+8+j*12);g.lineTo(w/2-j*4,-h/2+8+j*12);g.stroke()}
  g.fillStyle=fever>0?'#ffd447':'#d9a35a';g.fillRect(-w/2-4,-h/2-6,w+8,9);
  g.restore()}
function frame(now){requestAnimationFrame(frame);const el=now-t0,dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  let ox=0,oy=0;if(shake>0){ox=(Math.random()-.5)*shake;oy=(Math.random()-.5)*shake;shake*=.86;if(shake<.3)shake=0}
  g.setTransform(DPR,0,0,DPR,ox*DPR,oy*DPR);sky(el);
  if(state==='play'){
    if(keys.ArrowLeft)basket.tx-=520*dt;if(keys.ArrowRight)basket.tx+=520*dt;basket.tx=Math.max(basket.w/2,Math.min(W-basket.w/2,basket.tx));
    basket.x+=(basket.tx-basket.x)*Math.min(1,dt*18);basket.squash*=.82;
    if(fever>0){fever-=dt*1000;if(fever<=0){fever=0;startMusic()}}
    spawnT-=dt*1000;if(spawnT<=0){spawn(el);spawnT=Math.max(260,720-el/90)*(fever>0?.55:1)}
    for(const it of items){it.y+=it.vy*dt;it.rot+=it.vr*dt;
      if(!it.done&&it.y>H-92&&it.y<H-40&&Math.abs(it.x-basket.x)<basket.w/2+10){it.done=true;catchIt(it)}
      if(!it.done&&it.y>H+30){it.done=true;if(typeof it.k==='number'&&combo>1){combo=Math.max(1,combo-1);sfx.miss();hud()}}}
    items=items.filter(i=>!i.done)}
  for(const it of items){g.save();g.translate(it.x,it.y);g.rotate(it.k==='bug'?Math.sin(el/120)*.3:it.rot*.2);
    if(it.k==='star'){g.shadowColor='#ffd447';g.shadowBlur=24}else if(it.gold){g.shadowColor='#ffcc33';g.shadowBlur=16}
    g.font=`${it.k==='star'?40:34}px serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(it.k==='bug'?'🐛':it.k==='star'?'⭐':FRUIT[it.k].e,0,0);g.restore()}
  drawBasket();
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.life-=dt*1.4;g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
  parts=parts.filter(p=>p.life>0);g.globalAlpha=1;
  for(const t of texts){t.y-=60*dt;t.life-=dt*1.2;g.globalAlpha=Math.max(0,t.life);g.font=`${t.size}px Jua, sans-serif`;g.textAlign='center';g.lineWidth=4;g.strokeStyle='#0008';g.strokeText(t.txt,t.x,t.y);g.fillStyle=t.col;g.fillText(t.txt,t.x,t.y)}
  texts=texts.filter(t=>t.life>0);g.globalAlpha=1;
  if(fever>0){g.fillStyle='#ffd447';g.fillRect(0,H-6,W*(fever/6000),6)}}
basket.x=basket.tx=W/2;requestAnimationFrame(frame);
window.__basket={start,state:()=>state,score:()=>score,end:()=>over()};
})();
